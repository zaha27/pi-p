[project]
name = "pi-p"
version = "0.1.0"
description = "Detecție de obiecte în imagini de dronă (VisDrone) cu YOLO26"
requires-python = ">=3.12"
dependencies = [
    "ultralytics>=8.4.171",
    "torch>=2.8",
    "torchvision",
    "pyyaml",
    "lap>=0.5.12",
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
]

[project.scripts]
pi-prepare = "pi_p.prepare:main"
pi-check = "pi_p.check:main"
pi-eda = "pi_p.eda:main"
pi-tile = "pi_p.tile:main"
pi-train = "pi_p.train:main"
pi-eval = "pi_p.evaluate:main"
pi-predict = "pi_p.predict:main"
pi-app = "pi_p.app.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
